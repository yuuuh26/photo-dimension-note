<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="description" content="スマホで写真に寸法線、矢印、コメント、伏せ字を書き込める端末内完結のツール">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <title>写真寸法メモ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b0e11;
      --panel:#151a20;
      --panel-2:#1d242c;
      --line:#2b3540;
      --text:#f5f7f9;
      --muted:#aab5bf;
      --accent:#ffcc33;
      --accent-ink:#17130a;
      --danger:#ff6b72;
      --radius:16px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--text)}
    button,input{font:inherit}
    button{color:inherit}
    .app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top);background:radial-gradient(circle at 50% -20%,#26303a 0,transparent 40%),var(--bg)}
    .topbar{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
    .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
    .brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px #0008}
    .brand-mark svg{width:21px;height:21px}
    h1{font-size:1.08rem;line-height:1.2;margin:0;white-space:nowrap}
    .privacy{font-size:.72rem;color:var(--muted);white-space:nowrap;margin-top:2px}
    .top-actions{display:flex;gap:8px}
    .btn{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;min-height:44px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:750;font-size:.9rem;cursor:pointer}
    .btn:disabled{opacity:.38;cursor:not-allowed}
    .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
    .btn.icon{width:44px;padding:0}
    .btn svg{width:19px;height:19px;flex:none}
    .info-btn{background:#11161b}
    .quickbar{display:flex;align-items:center;gap:6px;padding:0 12px 9px;overflow-x:auto;scrollbar-width:none}
    .quickbar::-webkit-scrollbar{display:none}
    .chip{height:38px;min-width:40px;border:1px solid var(--line);background:#11161b;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:700;font-size:.84rem;white-space:nowrap}
    .chip:disabled{opacity:.35}
    .chip svg{width:18px;height:18px}
    .zoom-value{color:var(--muted);min-width:44px;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums}
    .stage{min-height:0;overflow:auto;overscroll-behavior:contain;padding:8px 10px 18px;scrollbar-color:#4a5661 transparent}
    .canvas-shell{min-width:100%;min-height:100%;width:max-content;display:grid;place-items:center}
    canvas{display:none;border-radius:12px;box-shadow:0 18px 55px #000b;background:#252b31;touch-action:none;user-select:none}
    .empty{align-self:center;justify-self:center;width:min(100%,420px);padding:28px 22px 34px;text-align:center}
    .empty-icon{width:82px;height:82px;border-radius:24px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(145deg,#232c34,#14191f);border:1px solid #323d47;box-shadow:0 16px 40px #0008;color:var(--accent)}
    .empty-icon svg{width:42px;height:42px}
    .empty h2{font-size:1.35rem;margin:0 0 9px}
    .empty p{font-size:.94rem;line-height:1.7;color:var(--muted);margin:0 0 22px}
    .empty .btn{width:100%;min-height:50px;font-size:1rem}
    .dock-wrap{position:relative;padding:8px 10px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent 0,#0b0e11 14px);z-index:5}
    .inspector{display:none;position:absolute;left:12px;right:12px;bottom:calc(100% - 5px);align-items:center;gap:7px;padding:8px;border:1px solid var(--line);background:#151a20f2;border-radius:14px;box-shadow:0 10px 30px #0009;overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(12px)}
    .inspector::-webkit-scrollbar{display:none}
    .inspector.show{display:flex}
    .swatch{width:34px;height:34px;border:2px solid #fff3;border-radius:50%;background:var(--swatch);box-shadow:inset 0 0 0 3px #0003}
    .swatch.active{outline:2px solid white;outline-offset:2px}
    .inspector-spacer{flex:1}
    .mini-btn{height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:750;font-size:.82rem}
    .mini-btn.danger{color:#ffd4d6;border-color:#62373b;background:#321d20}
    .thickness-control{display:none;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);font-weight:750;font-size:.76rem}
    .thickness-control.show{display:flex}
    .thickness-control input{width:92px;accent-color:#2fd176}
    .dock{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;background:#151a20f2;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 36px #000b;backdrop-filter:blur(12px)}
    .tool{min-width:0;min-height:58px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:750;font-size:.72rem}
    .tool svg{width:22px;height:22px}
    .tool.active{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 15px #ffcc3333}
    .sheet-backdrop{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center;padding:12px}
    .sheet-backdrop.show{display:flex}
    .sheet{width:min(100%,520px);background:#1a2027;border:1px solid #36414c;border-radius:20px;padding:18px;box-shadow:0 20px 80px #000;animation:rise .18s ease-out}
    @keyframes rise{from{transform:translateY(20px);opacity:0}}
    .sheet h2{font-size:1.05rem;margin:0 0 13px}
    .field{width:100%;min-height:52px;border-radius:12px;border:1px solid #46525e;background:#0f1317;color:#fff;padding:13px 14px;font-size:1.05rem;line-height:1.4;outline:none;resize:none}
    .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ffcc3322}
    .examples{color:var(--muted);font-size:.78rem;margin:8px 2px 16px}
    .size-picker{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 15px}
    .size-picker.show{display:grid}
    .size-choice{height:42px;border:1px solid #46525e;border-radius:11px;background:#11161b;color:var(--muted);font-weight:750}
    .size-choice.active{border-color:var(--accent);background:#2b2818;color:#ffe694;box-shadow:0 0 0 2px #ffcc331c}
    .sheet-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
    .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#f1f5f7;color:#111820;padding:10px 14px;border-radius:999px;font-weight:750;font-size:.85rem;box-shadow:0 10px 30px #0009;opacity:0;pointer-events:none;transition:.18s;z-index:30;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .info-dialog{width:min(calc(100% - 24px),560px);max-height:min(82dvh,720px);padding:0;border:1px solid #36414c;border-radius:20px;background:#1a2027;color:var(--text);box-shadow:0 24px 90px #000;overflow:hidden}
    .info-dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
    .info-card{padding:20px;overflow:auto;max-height:min(82dvh,720px)}
    .info-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
    .info-head-copy{flex:1;min-width:0}
    .info-head h2{font-size:1.2rem;margin:0 0 5px}
    .version{display:inline-flex;border:1px solid #45515d;border-radius:999px;padding:3px 9px;color:var(--muted);font-size:.76rem;font-weight:750}
    .made-by{margin:7px 0 0;color:var(--muted);font-size:.78rem}
    .close-info{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:#11161b;font-size:1.4rem;line-height:1}
    .info-section{padding:14px 0;border-top:1px solid var(--line)}
    .info-label{display:block;margin-bottom:7px;color:var(--muted);font-size:.78rem;font-weight:750}
    .storage-status{display:flex;align-items:center;gap:8px;font-weight:750}
    .status-dot{width:9px;height:9px;border-radius:50%;background:#8b98a5;box-shadow:0 0 0 4px #8b98a51e}
    .status-dot.ok{background:#2fd176;box-shadow:0 0 0 4px #2fd17620}
    .info-note{margin:8px 0 0;color:var(--muted);font-size:.78rem;line-height:1.6}
    .url-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
    .url-value{min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#0f1317;color:#dce4ea;font-size:.76rem;line-height:1.35;overflow-wrap:anywhere}
    .copy-btn{height:42px;padding:0 13px;border:1px solid #6e6122;border-radius:10px;background:#2b2818;color:#ffe694;font-weight:750}
    .privacy-detail{margin:0;color:#dce4ea;font-size:.85rem;line-height:1.65}
    .hidden{display:none!important}
    @media (min-width:760px){
      .app{max-width:920px;margin:auto;border-left:1px solid #202830;border-right:1px solid #202830}
      .topbar{padding-inline:18px}.quickbar{padding-inline:18px}.dock-wrap{padding-inline:18px}.tool{font-size:.8rem}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 18V6m16 12V6M4 12h16M7 9l-3 3 3 3m10-6 3 3-3 3"/></svg>
        </div>
        <div><h1>写真寸法メモ</h1><div class="privacy">写真は端末内だけで処理</div></div>
      </div>
      <div class="top-actions">
        <button class="btn icon info-btn" id="infoBtn" aria-label="アプリ情報" title="アプリ情報">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
        </button>
        <button class="btn icon" id="openPhoto" aria-label="写真を選ぶ" title="写真を選ぶ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
        </button>
        <button class="btn primary" id="exportBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
          保存
        </button>
      </div>
      <input id="photoInput" type="file" accept="image/*" class="hidden">
    </header>

    <div class="quickbar" aria-label="編集操作">
      <button class="chip" id="undoBtn" disabled aria-label="元に戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 7-5 5 5 5"/><path d="M20 17a8 8 0 0 0-11-5H4"/></svg></button>
      <button class="chip" id="redoBtn" disabled aria-label="やり直す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 7 5 5-5 5"/><path d="M4 17a8 8 0 0 1 11-5h5"/></svg></button>
      <span style="width:3px"></span>
      <button class="chip" id="zoomOut" disabled aria-label="縮小">−</button>
      <span class="zoom-value" id="zoomValue">100%</span>
      <button class="chip" id="zoomIn" disabled aria-label="拡大">＋</button>
      <button class="chip" id="fitBtn" disabled>全体表示</button>
      <button class="chip" id="clearBtn" disabled>新しい写真</button>
    </div>

    <section class="stage" id="stage" aria-label="写真編集エリア">
      <div class="canvas-shell" id="canvasShell">
        <div class="empty" id="emptyState">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18V6m16 12V6M4 12h16M7 9l-3 3 3 3m10-6 3 3-3 3"/><path d="M9 4h6M9 20h6" opacity=".65"/></svg>
          </div>
          <h2>写真に寸法を残そう</h2>
          <p>写真を選び、寸法線を指で引いて<br>測った長さを入力します。</p>
          <button class="btn primary" id="emptyOpen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            写真を選ぶ・撮影する
          </button>
        </div>
        <canvas id="canvas"></canvas>
      </div>
    </section>

    <footer class="dock-wrap">
      <div class="inspector" id="inspector" aria-label="選択項目の設定">
        <button class="swatch standard-color active" data-color="#ffd43b" style="--swatch:#ffd43b" aria-label="黄色"></button>
        <button class="swatch redact-color hidden" data-color="#2fd176" style="--swatch:#2fd176" aria-label="緑色"></button>
        <button class="swatch redact-color hidden" data-color="#111111" style="--swatch:#111111" aria-label="黒色"></button>
        <button class="swatch" data-color="#ff5d67" style="--swatch:#ff5d67" aria-label="赤色"></button>
        <button class="swatch standard-color" data-color="#33d6ff" style="--swatch:#33d6ff" aria-label="水色"></button>
        <button class="swatch" data-color="#ffffff" style="--swatch:#ffffff" aria-label="白色"></button>
        <label class="thickness-control" id="thicknessControl">太さ
          <input id="redactWidth" type="range" min="5" max="80" value="22" aria-label="伏せ字の太さ">
        </label>
        <span class="inspector-spacer"></span>
        <button class="mini-btn" id="editLabel">文字編集</button>
        <button class="mini-btn danger" id="deleteBtn">削除</button>
      </div>
      <nav class="dock" aria-label="描画ツール">
        <button class="tool active" data-mode="dimension">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18V6m16 12V6M4 12h16M7 9l-3 3 3 3m10-6 3 3-3 3"/></svg><span>寸法</span>
        </button>
        <button class="tool" data-mode="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19 19 5m0 0h-7m7 0v7"/></svg><span>矢印</span>
        </button>
        <button class="tool" data-mode="comment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z"/><path d="M7 8h10M7 12h7"/></svg><span>コメント</span>
        </button>
        <button class="tool" data-mode="redact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v10H4z"/><path d="M7 10h10M7 14h10"/></svg><span>伏せ字</span>
        </button>
        <button class="tool" data-mode="select">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 3 7 17 2.2-6.2L20 11 5 3Z"/></svg><span>選択</span>
        </button>
        <button class="tool" data-mode="pan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 11V6a2 2 0 0 1 4 0v4-5a2 2 0 0 1 4 0v5-3a2 2 0 0 1 4 0v7a7 7 0 0 1-7 7h-1a7 7 0 0 1-6.2-3.8L3 12a2 2 0 0 1 3.5-1.9L8 13"/></svg><span>移動</span>
        </button>
      </nav>
    </footer>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <form class="sheet" id="labelForm">
      <h2 id="sheetTitle">寸法を入力</h2>
      <textarea class="field" id="labelInput" rows="1" autocomplete="off" enterkeyhint="done" placeholder="例：120 cm"></textarea>
      <div class="examples" id="sheetHint">「幅 120cm」「85 mm」など自由に入力できます</div>
      <div class="size-picker" id="commentSizes" aria-label="コメントの文字サイズ">
        <button type="button" class="size-choice active" data-size="tiny">極小</button>
        <button type="button" class="size-choice" data-size="small">小</button>
        <button type="button" class="size-choice" data-size="medium">中</button>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn" id="cancelLabel">キャンセル</button>
        <button type="submit" class="btn primary">決定</button>
      </div>
    </form>
  </div>
  <dialog class="info-dialog" id="infoDialog" aria-labelledby="infoTitle">
    <div class="info-card">
      <div class="info-head">
        <div class="info-head-copy">
          <h2 id="infoTitle">写真寸法メモ</h2>
          <span class="version" id="versionText">v1.0.0</span>
          <p class="made-by">Made by YUU</p>
        </div>
        <button class="close-info" id="closeInfo" aria-label="閉じる">×</button>
      </div>
      <section class="info-section">
        <span class="info-label">保存状態</span>
        <div class="storage-status"><span class="status-dot" id="storageDot"></span><span id="storageStatus">確認中</span></div>
        <p class="info-note">ブラウザデータの削除、端末の初期化、機種変更などでは失われる可能性があります。</p>
      </section>
      <section class="info-section">
        <span class="info-label">公開URL</span>
        <div class="url-row"><div class="url-value" id="publicUrl"></div><button class="copy-btn" data-copy="public">コピー</button></div>
        <span class="info-label" style="margin-top:14px">GitHub</span>
        <div class="url-row"><div class="url-value" id="githubUrl"></div><button class="copy-btn" data-copy="github">コピー</button></div>
      </section>
      <section class="info-section">
        <p class="privacy-detail">写真・編集データは原則としてこの端末内で処理されます。写真を外部サーバーへアップロードする機能はありません。</p>
      </section>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';
    const CONFIG = Object.freeze({
      name: '写真寸法メモ',
      version: 'v1.0.0',
      publicUrl: 'https://yuuuh26.github.io/photo-dimension-note/',
      githubUrl: 'https://github.com/yuuuh26/photo-dimension-note',
      dbName: 'photo-dimension-note',
      dbVersion: 1,
      maxZoom: 8,
      maxImageSize: 4096,
      historyLimit: 40
    });
    const $ = (s) => document.querySelector(s);
    const canvas = $('#canvas');
    const ctx = canvas.getContext('2d');
    const stage = $('#stage');
    const emptyState = $('#emptyState');
    const photoInput = $('#photoInput');
    const inspector = $('#inspector');
    const labelSheet = $('#sheetBackdrop');
    const labelInput = $('#labelInput');
    const state = {
      image: null, imageBlob: null, annotations: [], selectedId: null,
      mode: 'dimension', color: '#ffd43b', redactColor: '#2fd176', redactWidth: 22, commentSize: 'tiny', zoom: 1,
      history: [], future: [], drawing: null, dragging: null, pendingEditor: null,
      pan: null, pinch: null, commentTap: null, redactWidthBefore: null, db: null,
      storagePersisted: false, saveErrorVisible: false
    };
    const pointers = new Map();
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
    const clamp = (n,a,b) => Math.max(a,Math.min(b,n));

    function toast(message){
      const el=$('#toast'); el.textContent=message; el.classList.add('show');
      clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800);
    }

    function openDB(){
      return new Promise((resolve) => {
        const req=indexedDB.open(CONFIG.dbName,CONFIG.dbVersion);
        req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('work'))req.result.createObjectStore('work')};
        req.onsuccess=()=>{state.db=req.result;resolve(req.result)};
        req.onerror=()=>{toast('保存機能を開始できませんでした');resolve(null)};
        req.onblocked=()=>toast('保存機能の更新が保留されています');
      });
    }
    async function saveLocal(){
      if(!state.db || !state.imageBlob) return;
      try{
        await new Promise((resolve,reject)=>{
          const tx=state.db.transaction('work','readwrite');
          tx.objectStore('work').put({imageBlob:state.imageBlob,annotations:state.annotations,updated:Date.now()},'current');
          tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
        });
        state.saveErrorVisible=false;
      }catch(e){
        if(!state.saveErrorVisible){state.saveErrorVisible=true;toast('保存できませんでした')}
      }
    }
    async function restoreLocal(){
      if(!state.db) return;
      const req=state.db.transaction('work').objectStore('work').get('current');
      req.onsuccess=async()=>{
        const saved=req.result;
        if(saved?.imageBlob){await loadImageBlob(saved.imageBlob,saved.annotations||[],false);toast('前回の編集を復元しました')}
      };
      req.onerror=()=>toast('前回の編集を復元できませんでした');
    }

    function commit(change){
      state.history.push(JSON.stringify(state.annotations));
      if(state.history.length>CONFIG.historyLimit) state.history.shift();
      state.future=[]; change(); updateButtons(); draw(); saveLocal();
    }
    function undo(){
      if(!state.history.length) return;
      state.future.push(JSON.stringify(state.annotations));
      state.annotations=JSON.parse(state.history.pop()); state.selectedId=null;
      updateButtons(); draw(); saveLocal();
    }
    function redo(){
      if(!state.future.length) return;
      state.history.push(JSON.stringify(state.annotations));
      state.annotations=JSON.parse(state.future.pop()); state.selectedId=null;
      updateButtons(); draw(); saveLocal();
    }

    function updateButtons(){
      const loaded=!!state.image;
      $('#exportBtn').disabled=!loaded; $('#zoomOut').disabled=!loaded; $('#zoomIn').disabled=!loaded;
      $('#fitBtn').disabled=!loaded; $('#clearBtn').disabled=!loaded;
      $('#undoBtn').disabled=!state.history.length; $('#redoBtn').disabled=!state.future.length;
      const selected=state.annotations.find(a=>a.id===state.selectedId);
      const isRedact=selected?.type==='redact'||(!selected&&state.mode==='redact');
      const activeColor=selected?.color||(isRedact?state.redactColor:state.color);
      inspector.classList.toggle('show',loaded&&(!!selected||state.mode==='redact'));
      $('#editLabel').classList.toggle('hidden',!selected || selected.type==='arrow' || selected.type==='redact');
      $('#deleteBtn').classList.toggle('hidden',!selected);
      $('#thicknessControl').classList.toggle('show',isRedact);
      document.querySelectorAll('.standard-color').forEach(b=>b.classList.toggle('hidden',isRedact));
      document.querySelectorAll('.redact-color').forEach(b=>b.classList.toggle('hidden',!isRedact));
      document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===activeColor));
      if(isRedact)$('#redactWidth').value=selected?.widthRatio??state.redactWidth;
    }

    function setMode(mode){
      state.mode=mode; state.selectedId=null; state.drawing=null;
      document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
      canvas.style.cursor=mode==='pan'?'grab':mode==='select'?'default':'crosshair';
      updateButtons(); draw();
    }

    function displayScale(){return canvas.clientWidth/canvas.width || 1}
    function metric(){
      const s=Math.max(canvas.width,canvas.height);
      return {line:clamp(s*.0025,4,11),font:clamp(s*.022,30,72),head:clamp(s*.014,19,48),handle:clamp(12/displayScale(),12,34)};
    }
    function updateDisplay(){
      if(!state.image) return;
      const fit=Math.min(1,(stage.clientWidth-20)/canvas.width);
      const w=Math.max(120,canvas.width*fit*state.zoom);
      canvas.style.width=w+'px'; canvas.style.height=(w*canvas.height/canvas.width)+'px';
      $('#zoomValue').textContent=Math.round(state.zoom*100)+'%';
    }

    async function loadImageBlob(blob,annotations=[],clearHistory=true){
      const url=URL.createObjectURL(blob); const img=new Image();
      await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
      const max=CONFIG.maxImageSize, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      state.image=img; state.imageBlob=blob; state.annotations=clone(annotations); state.selectedId=null; state.zoom=1;
      if(clearHistory){state.history=[];state.future=[]}
      emptyState.classList.add('hidden'); canvas.style.display='block';
      updateDisplay(); updateButtons(); draw(); URL.revokeObjectURL(url); saveLocal();
    }

    function line(ctx,x1,y1,x2,y2,color,width){
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();
    }
    function arrowHead(x,y,angle,color,size,width){
      ctx.beginPath();ctx.moveTo(x-Math.cos(angle-.58)*size,y-Math.sin(angle-.58)*size);ctx.lineTo(x,y);ctx.lineTo(x-Math.cos(angle+.58)*size,y-Math.sin(angle+.58)*size);
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    }
    function labelBadge(text,x,y,color,fontSize){
      ctx.save();ctx.font=`800 ${fontSize}px system-ui,-apple-system,"Noto Sans JP",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      const padX=fontSize*.42,padY=fontSize*.25,w=ctx.measureText(text).width+padX*2,h=fontSize+padY*2;
      ctx.fillStyle='#111820e8';roundRect(ctx,x-w/2,y-h/2,w,h,fontSize*.32);ctx.fill();
      ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,fontSize*.06);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(text,x,y+fontSize*.02);ctx.restore();
    }
    function commentFontSize(a){
      const s=Math.max(canvas.width,canvas.height),ratio={tiny:.007,small:.01,medium:.014}[a.size||'tiny'];
      return clamp(s*ratio,18,a.size==='medium'?54:a.size==='small'?40:30);
    }
    function commentLines(text,fontSize,maxWidth){
      ctx.font=`700 ${fontSize}px system-ui,-apple-system,"Noto Sans JP",sans-serif`;
      const output=[];
      for(const paragraph of String(text||'コメント').split('\n')){
        let line='';
        for(const ch of paragraph){
          const next=line+ch;
          if(line&&ctx.measureText(next).width>maxWidth){output.push(line);line=ch}else line=next;
        }
        output.push(line||' ');
      }
      return output.slice(0,8);
    }
    function drawComment(a){
      const fontSize=commentFontSize(a),maxWidth=canvas.width*.28,pad=fontSize*.38,lineH=fontSize*1.28;
      ctx.save();const lines=commentLines(a.label,fontSize,maxWidth);ctx.font=`700 ${fontSize}px system-ui,-apple-system,"Noto Sans JP",sans-serif`;
      const textW=Math.max(...lines.map(t=>ctx.measureText(t).width)),w=textW+pad*2,h=lines.length*lineH+pad*1.45,x=a.x1-w/2,y=a.y1-h/2;
      ctx.fillStyle='#0b1116dc';roundRect(ctx,x,y,w,h,fontSize*.28);ctx.fill();
      ctx.strokeStyle=a.color;ctx.lineWidth=Math.max(1.5,fontSize*.07);ctx.stroke();
      ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';
      lines.forEach((t,i)=>ctx.fillText(t,x+pad,y+pad*.72+lineH*(i+.5)));ctx.restore();
      return {x,y,w,h};
    }
    function roundRect(c,x,y,w,h,r){
      r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
    }
    function drawAnnotation(a,selected=false){
      const m=metric(),dx=a.x2-a.x1,dy=a.y2-a.y1,ang=Math.atan2(dy,dx),len=Math.hypot(dx,dy)||1;
      if(a.type==='dimension'){
        line(ctx,a.x1,a.y1,a.x2,a.y2,a.color,m.line);
        arrowHead(a.x1,a.y1,ang+Math.PI,a.color,m.head,m.line);
        arrowHead(a.x2,a.y2,ang,a.color,m.head,m.line);
        const nx=-dy/len,ny=dx/len,off=m.font*.9;
        labelBadge(a.label||'寸法', (a.x1+a.x2)/2+nx*off,(a.y1+a.y2)/2+ny*off,a.color,m.font);
      }else if(a.type==='arrow'){
        line(ctx,a.x1,a.y1,a.x2,a.y2,a.color,m.line);
        arrowHead(a.x2,a.y2,ang,a.color,m.head,m.line);
      }else if(a.type==='redact'){
        ctx.save();ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);
        ctx.strokeStyle=a.color||'#2fd176';ctx.lineWidth=Math.max(2,Math.max(canvas.width,canvas.height)*(a.widthRatio??22)/1000);
        ctx.lineCap='square';ctx.stroke();ctx.restore();
      }else if(a.type==='comment'||a.type==='text'){
        drawComment(a);
      }
      if(selected){
        ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#12171c';ctx.lineWidth=Math.max(3,m.line*.7);
        const pts=(a.type==='comment'||a.type==='text')?[[a.x1,a.y1]]:[[a.x1,a.y1],[a.x2,a.y2]];
        pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,m.handle,0,Math.PI*2);ctx.fill();ctx.stroke()});ctx.restore();
      }
    }
    function draw(){
      if(!state.image) return;
      ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(state.image,0,0,canvas.width,canvas.height);
      state.annotations.forEach(a=>drawAnnotation(a,a.id===state.selectedId));
      if(state.drawing) drawAnnotation(state.drawing,false);
    }

    function point(e){
      const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
    }
    function distToSegment(p,a,b){
      const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return Math.hypot(p.x-a.x,p.y-a.y);
      const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
    }
    function hitTest(p){
      const tol=22/displayScale(),list=[...state.annotations].reverse();
      for(const a of list){
        if(a.type==='comment'||a.type==='text'){
          const fontSize=commentFontSize(a),lines=commentLines(a.label,fontSize,canvas.width*.28),w=Math.max(...lines.map(t=>ctx.measureText(t).width))+fontSize*.76,h=lines.length*fontSize*1.28+fontSize*.55;
          if(Math.abs(p.x-a.x1)<w/2+tol&&Math.abs(p.y-a.y1)<h/2+tol)return a;
        }
        else if(distToSegment(p,{x:a.x1,y:a.y1},{x:a.x2,y:a.y2})<tol+(a.type==='redact'?Math.max(canvas.width,canvas.height)*(a.widthRatio??22)/2000:0))return a;
      }return null;
    }
    function selectedPart(a,p){
      const tol=28/displayScale();
      if(Math.hypot(p.x-a.x1,p.y-a.y1)<tol)return 'start';
      if(a.type!=='text'&&a.type!=='comment'&&Math.hypot(p.x-a.x2,p.y-a.y2)<tol)return 'end';
      return 'move';
    }

    canvas.addEventListener('pointerdown',(e)=>{
      if(!state.image)return; canvas.setPointerCapture(e.pointerId);
      if(e.pointerType==='touch'){
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pointers.size>=2){
          const pts=[...pointers.values()],dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
          state.pinch={startDistance:Math.hypot(dx,dy),startZoom:state.zoom};
          state.drawing=null;state.dragging=null;state.pan=null;state.commentTap=null;draw();return;
        }
      }
      const p=point(e);
      if(state.mode==='pan'){
        state.pan={clientX:e.clientX,clientY:e.clientY,left:stage.scrollLeft,top:stage.scrollTop};canvas.style.cursor='grabbing';return;
      }
      if(state.mode==='select'){
        const current=state.annotations.find(a=>a.id===state.selectedId);
        const target=(current&&selectedPart(current,p)!=='move'&&Math.min(Math.hypot(p.x-current.x1,p.y-current.y1),current.type==='text'?Infinity:Math.hypot(p.x-current.x2,p.y-current.y2))<30/displayScale())?current:hitTest(p);
        state.selectedId=target?.id||null;
        if(target)state.dragging={id:target.id,part:selectedPart(target,p),start:p,before:JSON.stringify(state.annotations),original:clone(target),moved:false};
        updateButtons();draw();return;
      }
      if(state.mode==='comment'){state.commentTap=p;return}
      const isRedact=state.mode==='redact';
      state.drawing={id:uid(),type:state.mode,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:isRedact?state.redactColor:state.color,widthRatio:isRedact?state.redactWidth:undefined,label:''};draw();
    });

    canvas.addEventListener('pointermove',(e)=>{
      if(e.pointerType==='touch'&&pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(state.pinch&&pointers.size>=2){
        const pts=[...pointers.values()],dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
        const distance=Math.hypot(dx,dy),cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
        applyZoomAt(state.pinch.startZoom*distance/Math.max(1,state.pinch.startDistance),cx,cy);return;
      }
      if(state.pinch)return;
      if(state.pan){stage.scrollLeft=state.pan.left-(e.clientX-state.pan.clientX);stage.scrollTop=state.pan.top-(e.clientY-state.pan.clientY);return}
      const p=point(e);
      if(state.drawing){
        let x=p.x,y=p.y,dx=x-state.drawing.x1,dy=y-state.drawing.y1;
        if(state.drawing.type==='dimension'){
          if(Math.abs(dx)>Math.abs(dy)*4)y=state.drawing.y1;
          else if(Math.abs(dy)>Math.abs(dx)*4)x=state.drawing.x1;
        }
        state.drawing.x2=x;state.drawing.y2=y;draw();return;
      }
      if(state.dragging){
        const a=state.annotations.find(x=>x.id===state.dragging.id);if(!a)return;
        const dx=p.x-state.dragging.start.x,dy=p.y-state.dragging.start.y,o=state.dragging.original;
        if(Math.hypot(dx,dy)>2/displayScale())state.dragging.moved=true;
        if(state.dragging.part==='start'){a.x1=clamp(o.x1+dx,0,canvas.width);a.y1=clamp(o.y1+dy,0,canvas.height)}
        else if(state.dragging.part==='end'){a.x2=clamp(o.x2+dx,0,canvas.width);a.y2=clamp(o.y2+dy,0,canvas.height)}
        else{a.x1=clamp(o.x1+dx,0,canvas.width);a.y1=clamp(o.y1+dy,0,canvas.height);a.x2=clamp(o.x2+dx,0,canvas.width);a.y2=clamp(o.y2+dy,0,canvas.height)}
        draw();
      }
    });

    function endPointer(e){
      if(e?.pointerType==='touch')pointers.delete(e.pointerId);
      if(state.pinch){if(!pointers.size)state.pinch=null;return}
      if(state.commentTap){
        const p=state.commentTap;state.commentTap=null;
        if(e?.type!=='pointercancel')openEditor({id:uid(),type:'comment',x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:state.color,size:state.commentSize,label:''},true);
        return;
      }
      if(state.pan){state.pan=null;canvas.style.cursor='grab';return}
      if(state.dragging){
        if(state.dragging.moved){state.history.push(state.dragging.before);state.future=[];saveLocal()}
        state.dragging=null;updateButtons();draw();return;
      }
      if(state.drawing){
        const a=state.drawing;state.drawing=null;
        if(Math.hypot(a.x2-a.x1,a.y2-a.y1)<18/displayScale()){draw();return}
        if(a.type==='dimension')openEditor(a,true);else commit(()=>state.annotations.push(a));
      }
    }
    canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);

    function openEditor(annotation,isNew){

      const isComment=annotation.type==='comment'||annotation.type==='text';
      $('#sheetTitle').textContent=isComment?(isNew?'コメントを入力':'コメントを編集'):(isNew?'寸法を入力':'寸法を編集');
      $('#sheetHint').textContent=isComment?'写真を隠しにくい小さな文字で配置します':'「幅 120cm」「85 mm」など自由に入力できます';
      labelInput.value=annotation.label||'';labelInput.placeholder=isComment?'例：棚板の奥行きに注意':'例：120 cm';
      labelInput.rows=isComment?3:1;

    }
    function closeEditor(){state.pendingEditor=null;labelSheet.classList.remove('show');draw()}

    $('#deleteBtn').addEventListener('click',()=>{

    $('#undoBtn').addEventListener('click',undo);$('#redoBtn').addEventListener('click',redo);

    function applyZoomAt(next,clientX,clientY){
      if(!state.image)return;
      next=clamp(next,1,CONFIG.maxZoom);if(Math.abs(next-state.zoom)<.008)return;
      const before=canvas.getBoundingClientRect(),rx=clamp((clientX-before.left)/before.width,0,1),ry=clamp((clientY-before.top)/before.height,0,1);

    }

    async function requestPersistentStorage(){

      try{
        let persisted=await navigator.storage.persisted();

        updateStorageStatus(persisted);return persisted;
      }catch(e){updateStorageStatus(false);return false}

    async function copyText(value){

          document.body.appendChild(area);area.select();if(!document.execCommand('copy'))throw new Error('copy failed');area.remove();
        }

      }catch(e){toast('コピーできませんでした')}
    }

    function localDateStamp(date=new Date()){

    }

    $('#exportBtn').addEventListener('click',()=>{

        const name='寸法メモ_'+localDateStamp()+'.png';const file=new File([blob],name,{type:'image/png'});
        let shareFailed=false;
        try{
          if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:CONFIG.name});toast('共有しました');return}
        }catch(e){if(e?.name==='AbortError'){draw();return}else shareFailed=true}
        const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('画像を保存しました');draw();
        if(shareFailed)setTimeout(()=>toast('共有できないため端末へ保存しました'),100);
      },'image/png');
    });

    openDB().then(restoreLocal);requestPersistentStorage();updateButtons();
    if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  })();
  </script>
</body>
</html>
